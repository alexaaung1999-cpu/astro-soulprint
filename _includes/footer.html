  <a class="float-cta" href="https://m.me/astrosoulprintbyalex" target="_blank" rel="noopener" aria-label="Book a reading on Messenger">Book a Reading</a>

  <script>
    document.documentElement.classList.add('js');
    document.getElementById('year').textContent = new Date().getFullYear();

    // Mobile menu
    var nav = document.getElementById('site-nav');
    var toggle = document.querySelector('.nav-toggle');
    toggle.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    });
    var sub = document.querySelector('.sub-toggle');
    sub.addEventListener('click', function () {
      var open = sub.parentNode.classList.toggle('open');
      sub.setAttribute('aria-expanded', open);
    });
    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') { nav.classList.remove('open'); toggle.setAttribute('aria-expanded', false); }
    });

    // After the Energetic Exchange deadline (end of Oct 31, 2026, Myanmar time), show the regular price.
    if (Date.now() > Date.parse('2026-10-31T23:59:59+06:30')) {
      document.documentElement.classList.add('offer-ended');
    }
  </script>
